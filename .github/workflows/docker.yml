name: Docker Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checking out the repo
              uses: actions/checkout@v4

            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Frontend
              uses: docker/build-push-action@v6
              with:
                context: ./frontend
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/films_frontend:latest
                cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/films_frontend:latest
                cache-to: type=inline

            - name: Build and push Backend
              uses: docker/build-push-action@v6
              with:
                context: ./backend
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/films_backend:latest
                cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/films_backend:latest
                cache-to: type=inline

            - name: Build and push Nginx
              uses: docker/build-push-action@v6
              with:
                context: ./nginx
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/films_nginx:latest
                cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/films_nginx:latest
                cache-to: type=inline
